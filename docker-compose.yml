services:
  db:
    container_name: oracle
    image: gvenzl/oracle-xe
    environment:
      - ORACLE_PASSWORD=oui
      - APP_USER=hangarstation
      - APP_USER_PASSWORD=hangarstation
    ports:
      - "1521:1521"
    volumes:
      - oracle_data:/opt/oracle/oradata
    restart: unless-stopped

  redis:
    container_name: redis
    image: redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  oracle_data:
  redis_data:

